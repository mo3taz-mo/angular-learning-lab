<a class="skip-link" href="#main-content" (click)="$event.preventDefault(); focusMain()">
  Skip to main content
</a>

<header class="app-header">
  <a class="app-header__title" routerLink="/">Angular Learning Lab</a>
  <nav aria-label="Main">
    <ul class="app-nav">
      <li>
        <a
          routerLink="/"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: true }"
          ariaCurrentWhenActive="page"
          >Home</a
        >
      </li>
      <li>
        <a routerLink="/roadmap" routerLinkActive="is-active" ariaCurrentWhenActive="page"
          >Roadmap</a
        >
      </li>
    </ul>
  </nav>
</header>

<main #mainContent id="main-content" class="app-main" tabindex="-1">
  <router-outlet />
</main>
