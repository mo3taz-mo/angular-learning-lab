@let current = phase();
@let status = current.status;

<mat-card appearance="outlined" class="phase-card" [attr.data-status]="status">
  <mat-card-content>
    <div [attr.lang]="textLanguage().code" [attr.dir]="textLanguage().dir">
      <h3 class="phase-card__title">
        <a [routerLink]="['/roadmap', current.id]">{{ title() }}</a>
      </h3>
      <p class="phase-card__summary">{{ summary() }}</p>
    </div>
    <p class="phase-card__status">
      @switch (status) {
        @case ('done') {
          {{ 'status.done' | t }}
        }
        @case ('in-progress') {
          {{ 'status.in-progress' | t }}
        }
        @case ('planned') {
          {{ 'status.planned' | t }}
        }
        @default never;
      }
    </p>
  </mat-card-content>
</mat-card>
